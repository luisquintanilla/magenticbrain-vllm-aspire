<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <style>
      .h1{font-size:24px;font-weight:700;fill:#141a21}
      .h2{font-size:13.5px;fill:#5a6672}
      .btitle{font-size:15px;font-weight:700}
      .sub{font-size:11.5px;fill:#48515c}
      .badge{font-size:10.5px;font-weight:700;fill:#fff;letter-spacing:.5px}
      .clabel{font-size:13.5px;font-weight:700;fill:#5b3fb0}
      .elbl{font-size:11px;font-weight:600;fill:#33404d}
      .lg{font-size:11.5px;fill:#48515c}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455A64"/>
    </marker>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b1a33" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="690" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" class="h1">Local RAG on your GPU — MagenticBrain · vLLM · Aspire</text>
  <text x="500" y="64" text-anchor="middle" class="h2">Everything runs locally: the 14B LLM, embeddings, document ingestion, and the vector store</text>

  <!-- Browser -->
  <rect x="135" y="96" width="170" height="44" rx="9" fill="#ECEFF1" stroke="#37474F" stroke-width="1.5" filter="url(#ds)"/>
  <text x="220" y="123" text-anchor="middle" class="btitle" fill="#263238">Browser — Chat UI</text>

  <!-- Aspire cluster -->
  <rect x="40" y="158" width="920" height="452" rx="16" fill="#F7F5FD" stroke="#6F4BD8" stroke-width="2"/>
  <text x="500" y="182" text-anchor="middle" font-size="13" font-weight="600" fill="#5b3fb0">Aspire AppHost  ·  orchestration · health-gated startup · dashboard</text>

  <!-- Web (project) -->
  <rect x="95" y="238" width="250" height="158" rx="12" fill="#EEE9FC" stroke="#512BD4" stroke-width="2" filter="url(#ds)"/>
  <rect x="285" y="250" width="52" height="18" rx="9" fill="#512BD4"/>
  <text x="311" y="263" text-anchor="middle" class="badge">PROJECT</text>
  <text x="120" y="278" class="btitle" fill="#512BD4">Blazor Web · aichatweb</text>
  <text x="120" y="302" class="sub">Blazor Server (interactive)</text>
  <text x="120" y="321" class="sub">Microsoft.Extensions.AI</text>
  <text x="120" y="340" class="sub">IChatClient + IEmbeddingGenerator</text>
  <text x="120" y="359" class="sub">RAG ingestion + semantic search</text>
  <text x="120" y="378" class="sub">function-invocation tool loop</text>

  <!-- SqliteVec cylinder -->
  <path d="M150,470 v42 a70,12 0 0 0 140,0 v-42" fill="#EEF1F4" stroke="#5F6B7A" stroke-width="1.5"/>
  <ellipse cx="220" cy="470" rx="70" ry="12" fill="#F5F7F9" stroke="#5F6B7A" stroke-width="1.5"/>
  <text x="220" y="468" text-anchor="middle" class="sub" font-weight="700" fill="#3f4854">SqliteVec</text>
  <text x="220" y="486" text-anchor="middle" class="sub">vector-store.db</text>
  <text x="220" y="503" text-anchor="middle" class="sub">768-dim · local file</text>

  <!-- vLLM (GPU) -->
  <rect x="630" y="232" width="300" height="122" rx="12" fill="#EEF7E0" stroke="#4C8C1B" stroke-width="2" filter="url(#ds)"/>
  <rect x="884" y="244" width="36" height="18" rx="9" fill="#5f9e12"/>
  <text x="902" y="257" text-anchor="middle" class="badge">GPU</text>
  <text x="652" y="262" class="btitle" fill="#3c7a12">vLLM · Docker</text>
  <text x="652" y="286" class="sub">microsoft/MagenticBrain — 14B (Qwen3)</text>
  <text x="652" y="305" class="sub">4-bit NF4 (bitsandbytes) · fits 16 GB VRAM</text>
  <text x="652" y="324" class="sub">non-thinking default · Hermes tool-calling</text>
  <text x="652" y="343" class="sub">OpenAI-compatible /v1 endpoint</text>

  <!-- Ollama (CPU) -->
  <rect x="630" y="380" width="300" height="92" rx="12" fill="#E7F0FB" stroke="#1565C0" stroke-width="2" filter="url(#ds)"/>
  <rect x="884" y="392" width="36" height="18" rx="9" fill="#1976D2"/>
  <text x="902" y="405" text-anchor="middle" class="badge">CPU</text>
  <text x="652" y="410" class="btitle" fill="#12579e">Ollama · Docker</text>
  <text x="652" y="434" class="sub">nomic-embed-text embeddings</text>
  <text x="652" y="453" class="sub">/api/embed · 768-dim · keeps VRAM free</text>

  <!-- MarkItDown (MCP) -->
  <rect x="630" y="498" width="300" height="84" rx="12" fill="#FBF3DE" stroke="#B8860B" stroke-width="2" filter="url(#ds)"/>
  <rect x="884" y="510" width="36" height="18" rx="9" fill="#c78a00"/>
  <text x="902" y="523" text-anchor="middle" class="badge">MCP</text>
  <text x="652" y="528" class="btitle" fill="#9a7200">MarkItDown · Docker</text>
  <text x="652" y="552" class="sub">PDF / Office → Markdown</text>
  <text x="652" y="571" class="sub">MCP server, called during ingestion</text>

  <!-- Edges -->
  <!-- browser -> web -->
  <line x1="220" y1="140" x2="220" y2="236" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="175" y="203" width="92" height="18" rx="9" fill="#ffffff" stroke="#cdd6de"/>
  <text x="221" y="216" text-anchor="middle" class="elbl">HTTP · SignalR</text>

  <!-- web -> vllm -->
  <line x1="345" y1="300" x2="628" y2="288" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="415" y="272" width="132" height="18" rx="9" fill="#ffffff" stroke="#cdd6de"/>
  <text x="481" y="285" text-anchor="middle" class="elbl">chat · tool-calling</text>

  <!-- web -> ollama -->
  <line x1="345" y1="332" x2="628" y2="418" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="404" y="356" width="150" height="18" rx="9" fill="#ffffff" stroke="#cdd6de"/>
  <text x="479" y="369" text-anchor="middle" class="elbl">embeddings (768-dim)</text>

  <!-- web -> markitdown -->
  <line x1="345" y1="364" x2="628" y2="528" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="398" y="446" width="140" height="18" rx="9" fill="#ffffff" stroke="#cdd6de"/>
  <text x="468" y="459" text-anchor="middle" class="elbl">ingest: PDF → Markdown</text>

  <!-- web <-> sqlitevec -->
  <line x1="220" y1="396" x2="220" y2="456" stroke="#455A64" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="232" y="416" width="86" height="18" rx="9" fill="#ffffff" stroke="#cdd6de"/>
  <text x="275" y="429" text-anchor="middle" class="elbl">vectors R/W</text>

  <!-- Quantizer one-shot job (gates vLLM) -->
  <rect x="352" y="196" width="252" height="34" rx="12" fill="#F4FAEC" stroke="#4C8C1B" stroke-width="1.6" stroke-dasharray="6 4"/>
  <rect x="364" y="204" width="34" height="16" rx="8" fill="#5f9e12"/>
  <text x="381" y="216" text-anchor="middle" class="badge">JOB</text>
  <text x="406" y="211" class="sub" font-weight="700" fill="#3c7a12">Quantizer · one-shot GPU job</text>
  <text x="406" y="224" class="sub">NF4 checkpoint · gates vLLM</text>
  <!-- gate edge: quantizer -> vllm -->
  <path d="M604,213 C622,213 616,260 628,262" fill="none" stroke="#455A64" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g transform="translate(95,646)">
    <rect x="0"   y="0" width="14" height="14" rx="3" fill="#EEF7E0" stroke="#4C8C1B" stroke-width="1.5"/><text x="20" y="11" class="lg">GPU container</text>
    <rect x="150" y="0" width="14" height="14" rx="3" fill="#E7F0FB" stroke="#1565C0" stroke-width="1.5"/><text x="170" y="11" class="lg">CPU container</text>
    <rect x="300" y="0" width="14" height="14" rx="3" fill="#FBF3DE" stroke="#B8860B" stroke-width="1.5"/><text x="320" y="11" class="lg">MCP container</text>
    <rect x="450" y="0" width="14" height="14" rx="3" fill="#EEE9FC" stroke="#512BD4" stroke-width="1.5"/><text x="470" y="11" class="lg">.NET project</text>
    <rect x="600" y="0" width="14" height="14" rx="3" fill="#EEF1F4" stroke="#5F6B7A" stroke-width="1.5"/><text x="620" y="11" class="lg">local data store</text>
    <rect x="762" y="0" width="14" height="14" rx="3" fill="#F7F5FD" stroke="#6F4BD8" stroke-width="1.5"/><text x="782" y="11" class="lg">Aspire AppHost</text>
  </g>
</svg>
