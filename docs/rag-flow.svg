<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><style>.ttl{font-size:22px;font-weight:700;fill:#141a21}.sub{font-size:13px;fill:#5a6672}.pt{font-size:13.5px;font-weight:700}.ps{font-size:10.5px;fill:#6b7480}.msg{font-size:11.5px;font-weight:600;fill:#2b3641}.band{font-size:11px;font-weight:700;fill:#8a7a3d}.band2{font-size:11px;font-weight:700;fill:#3f6ea5}</style><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455A64"/></marker><filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0b1a33" flood-opacity="0.13"/></filter></defs>
