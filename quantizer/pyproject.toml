[project]
name = "magenticbrain-quantizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "torch",
  "transformers",
  "bitsandbytes",
  "accelerate",
  "huggingface-hub",
]

[project.scripts]
quantize = "quantize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["quantize"]
